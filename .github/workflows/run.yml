name: IBD Paper Bot

on:
  schedule:
    # 1日1回 JST 07:00 (= UTC 22:00)。
    # 複数回/日に増やす場合はここに cron を追記する(APIコストに直結するため意図的に1回)。
    - cron: '0 22 * * *'   # JST 07:00

  workflow_dispatch:        # 手動実行可能

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ランナーは実行ごとに破棄されるため、cache/ を明示的に持ち越す。
      # ここに入るのは (a) 要約キャッシュ (b) 未完了バッチのID。
      # 持ち越せないと「バッチに課金したのにNotionへ書けていない」が起きる。
      - name: Restore summary cache / pending batch state
        id: botcache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: ibd-bot-state-${{ github.run_id }}
          restore-keys: |
            ibd-bot-state-

      - name: Run bot
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBMED_EMAIL: ${{ secrets.PUBMED_EMAIL }}
          PUBMED_API_KEY: ${{ secrets.PUBMED_API_KEY }}
        run: python src/main.py

      # 要約キャッシュと未完了バッチIDを保存する。
      # bot が失敗した場合でも持ち越したいので always()。
      - name: Save summary cache / pending batch state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: ibd-bot-state-${{ github.run_id }}
